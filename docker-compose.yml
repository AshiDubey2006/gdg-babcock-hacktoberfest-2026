services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:////data/grader.db
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-me}
      GRADER_MODE: ${GRADER_MODE:-mock}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-me-now}
      OLLAMA_URL: http://ollama:11434
      REDIS_URL: redis://redis:6379/0
    volumes: ["grader-data:/data","./backend:/app"]
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports: ["5173:5173"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    environment: ["VITE_API_URL=http://localhost:8000"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports: ["11434:11434"]
    volumes: ["ollama-data:/root/.ollama"]
volumes:
  grader-data:
  ollama-data:
  redis-data: 
